<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="サイコロで戦うターン制ローグライクRPG。ダイスを振って、装備とスキルを育てて地下20階を目指そう。20階のあとは、インフレするエンドレスが待っている。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<title>ちいさな迷宮 ダイス版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#c9d4ee; --bg2:#e6ebf9;
  --win-a:#2c3ca3; --win-b:#17216f; --line:#f3f6ff;
  --ink:#f4f6ff; --dim:#bcc6f2;
  --hp:#5fe08a; --mp:#5cc8ff; --exp:#ffd45c; --bad:#ff6b6b;
  --floor-a:#0a0e33; --floor-b:#251a52;
  --die:#f4f1e8; --pip:#1b1b2c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0c1b; --bg2:#12162f;
    --win-a:#1c2a7a; --win-b:#0a0f3d; --line:#dde5ff;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0c1b; --bg2:#12162f;
  --win-a:#1c2a7a; --win-b:#0a0f3d; --line:#dde5ff;
}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background:linear-gradient(var(--bg2),var(--bg));
  color:var(--ink);
  font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  font-size:15px;line-height:1.5;
}
button{font:inherit;color:inherit}
#app{max-width:460px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.win{
  position:relative;
  background:linear-gradient(var(--win-a),var(--win-b));
  border:3px solid var(--line);border-radius:6px;
  box-shadow:0 0 0 2px var(--win-b) inset,0 3px 0 rgba(0,0,0,.35);
  color:var(--ink);padding:10px 12px;
}
.sub{color:var(--dim);font-size:13px}

/* header */
#hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
#depth{font-size:18px}
#pips{display:flex;gap:3px;align-items:center;flex-wrap:nowrap;justify-content:flex-end;flex-shrink:0}
.dleft{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.dleft .sub{font-size:12px}
.pip{display:block;width:10px;height:10px;border:2px solid var(--line);border-radius:2px;opacity:.8}
.pip.boss{width:12px;height:12px;transform:rotate(45deg);border-radius:1px}
.pip.done{background:var(--line);opacity:.45}
.pip.now{background:var(--exp);border-color:var(--exp);opacity:1}

/* scene */
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#ename{font-size:17px}
.bar{height:12px;background:rgba(0,0,0,.45);border:2px solid var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:100%;background:var(--hp);transition:width .35s ease-out}
.bar.mp>i{background:var(--mp)}
.bar.xp>i{background:var(--exp)}
.bar.low>i{background:var(--bad)}
.stage{
  position:relative;margin-top:8px;height:196px;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;
  background:linear-gradient(var(--floor-a) 0 70%,var(--floor-b) 70% 100%);
  border:2px solid rgba(255,255,255,.35);border-radius:4px;
}
#eart{display:flex;align-items:flex-end;justify-content:center}
#eart svg{display:block}
#eart.enter{animation:enter .45s ease-out}
#eart.shake{animation:shake .28s}
#estatus{position:absolute;left:6px;top:6px;display:flex;gap:4px}
.chip{font-size:12px;line-height:1.4;border:1px solid var(--line);border-radius:3px;padding:0 6px;background:rgba(255,255,255,.12)}
.intent{margin-top:8px;font-size:14px;color:var(--dim)}
.intent b{color:var(--ink);font-weight:normal}

/* log */
#log{display:flex;flex-direction:column;justify-content:flex-end;height:7.3em;overflow:hidden;padding:8px 12px;font-size:14px}
#log div{color:var(--dim)}
#log div.new{color:var(--ink)}

/* player */
#pl.flash::after{content:"";position:absolute;inset:0;border-radius:3px;background:rgba(255,70,70,.45);animation:flash .35s ease-out forwards;pointer-events:none}
.pname{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.stat{display:grid;grid-template-columns:30px 1fr 64px;align-items:center;gap:8px;margin-top:4px}
.stat .num{text-align:right;font-size:13px}
.stat.xpr{opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}

/* commands */
.grp{color:var(--dim);font-size:13px;margin:8px 0 4px}
.grp:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cb{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;
  min-height:52px;padding:6px 10px;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.4);border-radius:4px;
}
.cb .nm{font-size:16px}
.cb .in{font-size:12px;color:var(--dim)}
.cb .res{color:var(--ink)}
.cb:hover:not(:disabled),.cb:focus-visible{background:rgba(255,255,255,.18);outline:2px solid var(--line);outline-offset:1px}
.cb:active:not(:disabled){transform:translateY(1px)}
.cb:disabled{opacity:.45;cursor:not-allowed}

/* dice */
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dbtns{display:flex;gap:6px}
.sbtn{min-height:36px;padding:4px 10px;font-size:14px;white-space:nowrap;cursor:pointer;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.45);border-radius:4px}
.sbtn:hover:not(:disabled),.sbtn:focus-visible{background:rgba(255,255,255,.22);outline:2px solid var(--line);outline-offset:1px}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
.dicebar{display:flex;gap:10px;justify-content:center;align-items:center;min-height:68px;margin:10px 0 4px;flex-wrap:wrap}
.die{width:56px;height:56px;padding:6px;border-radius:10px;cursor:pointer;background:var(--die);border:3px solid #2b2b40;box-shadow:0 3px 0 rgba(0,0,0,.4);transition:transform .12s}
.die .face{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%}
.die .face i{display:block;width:78%;height:78%;margin:auto;border-radius:50%}
.die .face i.on{background:var(--pip)}
.die{position:relative}
.die .big{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:30px;color:var(--pip);line-height:1}
.die .tag{position:absolute;right:-4px;bottom:-6px;font-style:normal;font-size:11px;line-height:1;padding:2px 4px;border-radius:4px;background:#2b2b40;color:#fff;border:1px solid rgba(255,255,255,.6)}
.die.t-even{background:#cfe3ff}
.die.t-high{background:#ffe3b8}
.die.t-gamble{background:#e6c9ff}
.die.t-d8{background:#c9f2d6}
.die.t-fire{background:#ffc3a8}
.die.t-gold{background:#ffe27a}
.die.t-d4{background:#d7e6ff}
.die.t-d10{background:#d2f4e4}
.die.t-odd{background:#ffd9e7}
.die.t-lucky{background:#fff0a8}
.die.t-ice{background:#bdefff}
.die.t-thunder{background:#fff19a}
.die.t-poison{background:#cde8a7}
.die.sel{transform:translateY(-6px);outline:3px solid var(--exp);outline-offset:2px}
.stage.l2{--floor-a:#1a1007;--floor-b:#4f3216}
.stage.l3{--floor-a:#05141a;--floor-b:#1d3c42}
.stage.l4{--floor-a:#10152e;--floor-b:#3a397b}
.die.used{opacity:.28;filter:grayscale(1);cursor:default}
.die.roll{animation:tumble .14s linear infinite}
.hint{text-align:center;font-size:13px;color:var(--dim);min-height:1.5em}

/* popups */
.pop{
  position:absolute;left:50%;top:42%;transform:translateX(-50%);
  font-size:30px;pointer-events:none;color:#fff;
  text-shadow:0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000;
  animation:pop .9s ease-out forwards;z-index:3;
}
#pl .pop{top:6px;font-size:24px}
.pop.gold{color:#ffd45c}
.eqh{font-size:13px;color:var(--dim);margin-bottom:6px}
.eq.leg b{color:var(--exp)}
.card.legend{border-color:#ffd45c;background:linear-gradient(135deg,rgba(255,212,92,.24),rgba(255,120,60,.16))}
.card.legend em{color:#ffd45c}
.eqpanel{border:2px solid rgba(255,255,255,.3);border-radius:6px;padding:8px;background:rgba(255,255,255,.06);font-size:13px;margin-bottom:2px}
.eqrow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;padding:4px 6px;align-items:center}
.eqrow .es,.eqpanel .es{font-size:12px;color:var(--dim)}
.lgbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.lgbox{max-height:52vh;overflow:auto;font-size:13px;line-height:1.55;padding:8px;border:2px solid rgba(255,255,255,.3);border-radius:6px;background:rgba(0,0,0,.25);-webkit-overflow-scrolling:touch}
.lg{white-space:pre-wrap;word-break:break-all;color:var(--dim)}
.lg.battle{margin-top:10px;color:var(--exp);font-size:14px}
.lg.turn{margin-top:8px;color:var(--ink);border-top:1px solid rgba(255,255,255,.25);padding-top:4px}
.lg.roll{color:#bfe3ff}
.lg.act{color:var(--ink)}
.lg.take{color:#ffb4b4}
.lg.s{color:var(--dim)}
.eq{display:grid;grid-template-columns:62px 1fr auto;gap:2px 8px;padding:4px 6px;border-radius:5px;border:2px solid transparent;align-items:center}
.eq b.none{color:var(--dim);opacity:.7;font-weight:normal}
.mv{display:flex;gap:4px}
.mvb{min-width:34px;min-height:30px;padding:0 6px;font-size:13px;cursor:pointer;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.4);border-radius:4px}
.mvb:hover:not(:disabled),.mvb:focus-visible{background:rgba(255,255,255,.22);outline:2px solid var(--line);outline-offset:1px}
.mvb:disabled{opacity:.3;cursor:not-allowed}
.eq .es{font-size:12px;color:var(--dim)}
.eq b{font-weight:normal}
.eq .ed{grid-column:2 / span 2;font-size:12px;color:var(--dim);line-height:1.35}
.eq .ed.none{color:var(--dim);opacity:.7}
.eq.hot{background:rgba(255,212,92,.25);border-color:var(--exp)}
#casc{position:absolute;left:6px;top:34px;right:6px;display:flex;flex-direction:column;gap:2px;font-size:13px;pointer-events:none;z-index:2}
#casc .cl{width:fit-content;max-width:100%;background:rgba(5,8,40,.78);border-radius:4px;padding:1px 7px;animation:clin .18s ease-out}
#casc .cl em{font-style:normal;color:var(--exp);margin-left:4px}
#bigscore{position:absolute;right:10px;bottom:6px;font-size:44px;line-height:1;color:#fff3a8;text-shadow:0 3px 0 #000,2px 0 0 #000,-2px 0 0 #000;pointer-events:none;z-index:2}
#bigscore.pulse{animation:bpulse .22s ease-out}
@keyframes clin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes bpulse{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.tally{display:grid;grid-template-columns:repeat(var(--cols,6),1fr);gap:6px;margin:10px 0 6px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;border:2px solid rgba(255,255,255,.35);border-radius:8px;background:rgba(255,255,255,.07);cursor:pointer;min-height:92px;color:var(--ink)}
.tcol:hover,.tcol:focus-visible{background:rgba(255,255,255,.18);outline:2px solid var(--line);outline-offset:1px}
.tcol.zero{opacity:.4}
.tcol.top{border-color:var(--hp)}
.tcol.lock{border-color:var(--exp);background:rgba(255,212,92,.2)}
.tcol .cnt{font-size:22px;line-height:1.1}
.tcol .keep{font-size:11px;line-height:1.2;min-height:1.2em;color:var(--hp)}
.tcol.lock .keep{color:var(--exp)}
.tcol.roll .cnt{animation:flick .16s linear infinite}
.mini{display:block;width:32px;height:32px;padding:3px;border-radius:7px;background:var(--die);border:2px solid #2b2b40}
.mini .face{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%}
.mini .face i{display:block;width:80%;height:80%;margin:auto;border-radius:50%}
.mini .face i.on{background:var(--pip)}
.mini .big{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:17px;color:var(--pip);line-height:1}
.score{display:flex;justify-content:center;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px;margin:6px 0 2px}
.score b{font-weight:normal;font-size:20px}
.score .tot{font-size:26px;color:var(--exp)}
.score .jp{font-style:normal;color:#ff8a5c;font-size:13px}
.pop.big{font-size:46px;color:#fff3a8;animation:popbig 1s ease-out forwards}
#eart.shakebig{animation:shakebig .4s}
@keyframes flick{0%{transform:translateY(-2px)}50%{transform:translateY(2px)}100%{transform:translateY(-2px)}}
@keyframes popbig{0%{opacity:0;transform:translateX(-50%) scale(.6)}20%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-50px)}}
@keyframes shakebig{0%,100%{transform:translateX(0)}15%{transform:translateX(-16px) rotate(-3deg)}35%{transform:translateX(14px) rotate(3deg)}60%{transform:translateX(-9px)}80%{transform:translateX(5px)}}
.goldtxt{color:var(--exp)}
.pop.dmg{color:#ffe27a}
.pop.hurt{color:#ff8a8a}
.pop.heal{color:#8dffb0}
.pop.miss{color:#d6dcff}

/* overlay */
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;padding:16px;background:rgba(6,8,24,.82);overflow:auto}
.ov[hidden]{display:none}
.box{width:100%;max-width:420px;padding:16px;margin:auto}
.box h2{margin:0 0 4px;font-size:22px;font-weight:normal}
.box p{margin:0 0 12px}
.box ul{margin:0 0 14px;padding-left:1.1em;color:var(--dim);font-size:14px}
.box li{margin:2px 0}
#ovB{display:flex;flex-direction:column;gap:8px}
.card{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;
  padding:10px 12px;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.45);border-radius:4px;
}
.card .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%}
.card b{font-weight:normal;font-size:17px}
.card em{font-style:normal;font-size:12px;color:var(--exp)}
.card .cd{font-size:13px;color:var(--dim)}
.card:hover,.card:focus-visible{background:rgba(255,255,255,.2);outline:2px solid var(--line);outline-offset:1px}
.card:disabled{opacity:.45;cursor:not-allowed}
.card em.gld{color:var(--exp)}
.card.go{align-items:center;justify-content:center;margin-top:2px}

@keyframes tumble{0%{transform:rotate(-12deg) translateY(-3px)}50%{transform:rotate(12deg) translateY(2px)}100%{transform:rotate(-12deg) translateY(-3px)}}
@keyframes pop{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-46px}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}45%{transform:translateX(8px)}70%{transform:translateX(-5px)}}
@keyframes flash{from{opacity:1}to{opacity:0}}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main id="app">
  <header class="win" id="hdr">
    <span class="dleft"><span id="depth"></span><span class="sub" id="layer"></span></span>
    <span id="pips" aria-hidden="true"></span>
  </header>

  <section class="win" id="scene">
    <div class="row"><span id="ename"></span><span class="sub" id="ehpTxt"></span></div>
    <div class="bar" id="ebar" style="margin-top:4px"><i id="ehp"></i></div>
    <div class="stage" id="stg">
      <div id="estatus"></div>
      <div id="casc"></div>
      <div id="bigscore"></div>
      <div id="eart"></div>
    </div>
    <div class="intent" id="intent"></div>
  </section>

  <section class="win" id="log" aria-live="polite"></section>

  <section class="win" id="pl">
    <div class="pname"><span>勇者 <span id="lv"></span></span><span id="gold" class="goldtxt"></span></div>
    <div class="stat"><span>HP</span><div class="bar" id="hpbar"><i id="hp"></i></div><span class="num" id="hpTxt"></span></div>
    <div class="stat"><span>MP</span><div class="bar mp"><i id="mp"></i></div><span class="num" id="mpTxt"></span></div>
    <div class="chips" id="chips"></div>
    <div class="sub" id="rec" style="margin-top:6px"></div>
  </section>

  <section class="win" id="dice"></section>

  <section class="win" id="cmd"></section>

  <section class="win" id="equip"></section>
</main>

<div class="ov" id="ov" hidden>
  <div class="win box" role="dialog" aria-modal="true" aria-labelledby="ovT">
    <h2 id="ovT"></h2>
    <p class="sub" id="ovS"></p>
    <div id="ovB"></div>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

/* ===== 調整用の数値 ===== */
const CFG={hp:80,mp:10,floorHp:6,floorMp:1,winHeal:0.2,winMp:4,dice:4,actions:3,rerolls:3,hp0:55,hpGrow:1.24,atk0:7,atkGrow:1.21,hpGrow2:1.16,atkGrow2:1.12,hpJump:1.35,atkJump:1.18};

/* ===== 敵のイラスト(SVG) ===== */
function crown(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-24 0 L-20 -26 L-8 -12 L0 -32 L8 -12 L20 -26 L24 0 Z" fill="#ffd24a" stroke="#a87400" stroke-width="3" stroke-linejoin="round"/><circle cx="0" cy="-10" r="3.5" fill="#e23b4e"/></g>`}
function slimeSVG(c,d,o={}){const sc=o.scale||1,w=Math.round(150*sc);
  return `<svg viewBox="0 0 160 160" width="${w}" height="${w}" role="img" aria-label="スライム">
  <ellipse cx="80" cy="142" rx="58" ry="9" fill="rgba(0,0,0,.35)"/>
  <path d="M18 134 C10 88 42 38 80 38 C118 38 150 88 142 134 Q80 148 18 134Z" fill="${c}" stroke="${d}" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="54" cy="68" rx="14" ry="8" fill="#fff" opacity=".55" transform="rotate(-35 54 68)"/>
  <ellipse cx="62" cy="98" rx="8" ry="11" fill="#14162b"/><ellipse cx="98" cy="98" rx="8" ry="11" fill="#14162b"/>
  <circle cx="65" cy="94" r="3" fill="#fff"/><circle cx="101" cy="94" r="3" fill="#fff"/>
  <path d="M68 118 Q80 128 92 118" stroke="#14162b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  ${o.crown?crown(80,40,1.1):''}</svg>`}
function goblinSVG(skin,dark,o={}){const sc=o.scale||1,w=Math.round(150*sc);
  return `<svg viewBox="0 0 160 160" width="${w}" height="${w}" role="img" aria-label="ゴブリン">
  <ellipse cx="80" cy="150" rx="52" ry="8" fill="rgba(0,0,0,.35)"/>
  ${o.cape?'<path d="M20 154 L46 110 L114 110 L140 154 Z" fill="#a82832" stroke="#5a1118" stroke-width="3" stroke-linejoin="round"/>':''}
  <path d="M42 152 Q44 118 80 116 Q116 118 118 152 Z" fill="#7b5632" stroke="#46301b" stroke-width="3"/>
  <polygon points="44,84 6,62 40,110" fill="${skin}" stroke="${dark}" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="116,84 154,62 120,110" fill="${skin}" stroke="${dark}" stroke-width="4" stroke-linejoin="round"/>

function fmt(n){
  if(!Number.isFinite(n))return n>0?'∞':String(n);
  n=Math.round(n);const a=Math.abs(n);
  if(a<10000)return String(n);
  if(a>=1e16){const [m,x]=n.toExponential(2).split('e');return m.replace(/\.?0+$/,'')+'e'+x.replace('+','')}
  for(const [u,sx] of UNITS){if(a>=u){const v=n/u;return (v>=100?String(Math.round(v)):v.toFixed(1).replace(/\.0$/,''))+sx}}
  return String(n);
}

/* ===== ダイスの集計（スキルはこれを見て威力が決まる） ===== */
const matchBonus=(M,jack)=>{const b=M<=1?1:M===2?1.3:M===3?1.6:M===4?2:2+0.5*(M-4);return jack?Math.max(b*1.5,3):b};   // 揃いボーナスに上限なし（5個以上は1個ごとに+0.5）
function pool(){
  const cnt={};let S=0,sumHigh=0,sumOdd=0,odd=0,high=0,even=0;
  for(const d of p.dice){
    cnt[d.v]=(cnt[d.v]||0)+1;
    const w=d.v*(d.t==='fire'?2:d.t==='ice'&&d.v<=3?2:d.t==='thunder'&&d.v%2===0?2:d.t==='poison'&&d.v%2===1?2:1);
    S+=w;
    if(d.v>=4){sumHigh+=w;high++}
    if(d.v%2===1){sumOdd+=w;odd++}else even++;
  }
  const faces=Object.keys(cnt).map(Number).sort((a,b)=>a-b);
  let M=0;faces.forEach(f=>{M=Math.max(M,cnt[f])});
  const N=p.dice.length,jack=N>=3&&faces.length===1;
  let run=0,best=0,prev=null;
  faces.forEach(f=>{run=(prev!==null&&f===prev+1)?run+1:1;best=Math.max(best,run);prev=f});
  const pairs=faces.filter(f=>cnt[f]>=2).length;
  const eqs=p.equip?equipped():[];
  const sm=eqs.reduce((m,it)=>m*(it.sumMul||1),1);
  let mult=matchBonus(M,jack);
  if(eqs.some(it=>it.matchPow))mult=+(mult*mult).toFixed(2);
  return {cnt,S:R(S*sm),N,M,mult,jack,run:best,pairs,high,sumHigh:R(sumHigh*sm),odd,sumOdd:R(sumOdd*sm),even};
}
const tallyText=()=>{const P=pool();return Object.keys(P.cnt).map(Number).sort((a,b)=>a-b).map(f=>`${f}×${P.cnt[f]}`).join(' ')};

function growSlots(){
  for(const t of SLOT_ORDER)p.equip.push({t,id:null});   // 増えた枠は一番下に追加（並び替えは自由）
}
function moveSlot(code){
  const [i,dir]=String(code).split(':');const k=+i,j=dir==='up'?k-1:k+1;
  if(!(k>=0&&k<p.equip.length)||j<0||j>=p.equip.length)return false;
  const a=p.equip[k],b=p.equip[j];
  p.equip[k]=b;p.equip[j]=a;
  rec(`【装備の並び替え】${a.id?ITEM_BY[a.id].name:'空き枠'}を${dir==='up'?'上':'下'}へ移動`,'s');
  return true;
}
const itemOpt=it=>({id:'i_'+it.id,name:it.name,tag:`装備・${SLOT_TYPE[it.slot]}${it.leg?'・伝説':it.rare?'・レア':''}`,desc:it.desc,cls:it.leg?'legend':'',apply:()=>equipItem(it,false)});
const takeMul=()=>equipped().reduce((m,it)=>m*(it.take?it.take():1),1);

function runPipeline(base,P,preview){
  let v=base;const steps=[];
  const skillId=p.currentSkill||'';
  const skillBoost=equipped().reduce((m,it)=>m*((it.skillMul&&it.skillMul[skillId])||1),1);
  if(skillBoost!==1){v=cl(v*skillBoost);steps.push({id:null,name:'スキル強化',msg:skillId,t:`×${skillBoost}`,v:R(v)})}
  for(const it of equipped()){
    if(!it.dmg)continue;
    const r=it.dmg(P);if(!r)continue;
    let t='';
    if(r.add){v=cl(v+r.add);t=`+${fmt(R(r.add))}`}
    if(r.mul){v=cl(v*r.mul);t=`×${fmtM(r.mul)}`}
    if(r.rand){
      const m=preview?(r.rand[0]+r.rand[1])/2:+(r.rand[0]+Math.random()*(r.rand[1]-r.rand[0])).toFixed(1);
      v=cl(v*m);t=`×${m}`;
    }
    steps.push({id:it.id,name:it.name,msg:r.msg,t,v:R(v)});
  }
  if(has('power')){v=cl(v*1.2);steps.push({id:null,name:'闘志',msg:'',t:'×1.2',v:R(v)})}
  if(p.dbl){v=cl(v*2);steps.push({id:null,name:'ダブルアップ',msg:'',t:'×2',v:R(v)})}
  return {base:R(base),steps,final:Math.max(1,R(cl(v)))};
}
const previewFinal=(base,P)=>runPipeline(base,P,true).final;
function guardFinal(base,P){
  let v=base;const steps=[];
  for(const it of equipped()){
    if(!it.sh)continue;
    const r=it.sh(P);if(!r)continue;
    v=cl(v+r.add);steps.push({id:it.id,name:it.name,msg:r.msg,t:`+${fmt(R(r.add))}`,v:R(v)});
  }
  return {base:R(base),steps,final:Math.max(1,R(v))};
}
async function cascade(res,note){
  const c=$('#casc'),bs=$('#bigscore');
  rec(`　${note||'基本'}＝${res.base}`,'act');
  c.innerHTML=`<div class="cl">${note||'基本'}<em>${fmt(res.base)}</em></div>`;
  bs.textContent=fmt(res.base);retrigger(bs,'pulse');
  await sleep(res.steps.length?240:120);
  for(const s of res.steps){
    p.hot=s.id;render();
    rec(`　${s.name}${s.msg?'（'+s.msg+'）':''} ${s.t} → ${s.v}`,'act');
    c.innerHTML+=`<div class="cl"><b>${s.name}</b> ${s.msg||''} ${s.t}<em>→ ${fmt(s.v)}</em></div>`;
    bs.textContent=fmt(s.v);retrigger(bs,'pulse');
    await sleep(260);
  }
  p.hot=null;render();
  rec(`　▶ 最終値 ${fmt(res.final)}`,'act');
  await sleep(res.steps.length?220:80);
  bs.textContent='';c.innerHTML='';
}
async function turnStartItems(){
  const P=pool();
  for(const it of equipped()){
    if(!it.turn)continue;
    const r=it.turn(P);if(!r)continue;
    p.hot=it.id;
    if(r.shield){const sh=R(r.shield*equipped().reduce((m,x)=>m*(x.shieldMul||1),1));p.shield+=sh;log(`${it.name}：${r.msg} → シールド+${sh}`);popup('pl','+'+sh,'heal')}
    if(r.heal){log(`${it.name}：${r.msg} → HP+${r.heal}`);healP(r.heal)}
    if(r.mp){p.mp=Math.min(p.maxMp,p.mp+r.mp);log(`${it.name}：${r.msg} → MP+${r.mp}`)}
    render();await sleep(320);
    p.hot=null;
  }
  render();
}

async function equipItem(it,paid){
  const mine=p.equip.filter(x=>x.t===it.slot);
  let slot=mine.find(x=>!x.id);
  const half=Math.round(it.price/2);
  if(!slot){
    const opts=mine.map((x,i)=>{const old=ITEM_BY[x.id];return {x,name:`${old.name}と入れ替える`,tag:SLOT_NAME[it.slot]+(mine.length>1?(i+1):''),desc:`${old.desc}（外した装備は${Math.round(old.price/2)}Gで売却）`,cls:old.leg?'legend':''}});
    opts.push({x:null,name:'見送る',tag:'',desc:paid?`${it.name}は買わない（代金は戻る）`:`${it.name}は受け取らない（${half}Gになる）`});
    const o=await pick(`${it.name}を装備する？`,`${it.desc}`,opts);
    if(!o.x){if(!paid){p.gold+=half;log(`${it.name}を見送り、${half}Gを得た。`)}return false}
    p.gold+=Math.round(ITEM_BY[o.x.id].price/2);
    slot=o.x;
  }
  slot.id=it.id;log(`${it.name}を装備した！`);
  return true;
}

function labelOf(r,P){
  const t=[];
  if(r.dmg)t.push(`ダメージ約${fmt(previewFinal(r.dmg,P))}`);
  if(r.poison)t.push(`毒${r.poison}×3`);
  if(r.freeze)t.push(e.boss?'攻撃半減':'凍結');
  if(r.drain)t.push('吸収');
  if(r.heal)t.push(`HP+${fmt(r.heal)}`);
  if(r.shield)t.push(`シールド${fmt(r.isGuard?guardFinal(r.shield,P).final:r.shield)}`);

const rollFace=t=>{const f=DICE_T[t].faces;return f[rnd(f.length)]};
async function rollAnim(idx){
  p.rolling=true;
  for(let f=0;f<6;f++){idx.forEach(i=>{p.dice[i].v=rollFace(p.dice[i].t)});render();await sleep(80)}
  p.rolling=false;

async function startTurn(){
  p.used={};p.actions=CFG.actions+(has('actions')?1:0)+equipped().reduce((a,it)=>a+(it.actions||0),0);p.actionsLeft=p.actions;
  p.rerolls=CFG.rerolls+(has('reroll')?1:0);p.locked=new Set();p.rerollsUsed=0;
  p.dice=[...p.slots,...Array(p.battleDiceBonus||0).fill('normal')].map(t=>({t,v:1}));
  await rollAnim(p.dice.map((_,i)=>i));
  const g=p.dice.filter(d=>d.t==='gold').reduce((a,d)=>a+d.v,0);
  if(g){p.gold+=g;log(`金のダイスが${g}Gを生んだ！`);popup('pl','+'+g+'G','gold')}
  const lucky=p.dice.filter(d=>d.t==='lucky').reduce((a,d)=>a+(d.v===8?2:0),0);
  if(lucky){p.gold+=lucky;log(`幸運ダイスの8がボーナス${lucky}Gを生んだ！`)}
  turnNo++;rec(`── ターン${turnNo} ──`,'turn');
  rec(`【ダイス】${p.slots.length}個を振った → ${tallyText()}`,'roll');
  const spc={};p.slots.forEach(t=>{if(t!=='normal')spc[t]=(spc[t]||0)+1});
  if(Object.keys(spc).length)rec(`　特殊ダイス：${Object.keys(spc).map(t=>DICE_T[t].name+'×'+spc[t]).join('、')}`,'roll');
  const P0=pool();rec(`　合計${P0.S}／最多${P0.M}個／揃い×${P0.mult}${P0.jack?'（ジャックポット）':''}／ペア${P0.pairs}組／最長連続${P0.run}`,'roll');
  log(`出目：${tallyText()}`,true);

  await turnStartItems();
}
async function reroll(){
  const idx=p.dice.map((d,i)=>p.locked.has(d.v)?-1:i).filter(i=>i>=0);
  if(p.rerolls<=0||!idx.length)return;
  busy=true;p.rerolls--;p.rerollsUsed++;
  const before=tallyText(),lf=[...p.locked][0];
  await rollAnim(idx);
  rec(`【振り直し】${lf?lf+'の目をキープして、':'キープなしで、'}${idx.length}個を振り直した（残り${p.rerolls}回）`,'roll');
  rec(`　前：${before}`,'roll');rec(`　後：${tallyText()}`,'roll');
  log(`振り直し：${tallyText()}`,true);
  busy=false;render();
}

/* ===== 戦闘 ===== */
async function hit(amount){
  let d=Math.max(1,R(cl(amount)));
  if(e.vulnerable){d=R(d*1.5);e.vulnerable=false;log(`${e.name}の隙を突いた！ダメージ1.5倍！`)}
  const big=d>=e.maxHp*.25;
  e.hp=Math.max(0,e.hp-d);
  if(d>(p.maxHit||0)){p.maxHit=d}
  log(`${e.name}に${fmt(d)}のダメージ！`);popup('scene',fmt(d),big?'dmg big':'dmg');shake(big);render();
  await sleep(big?520:380);
  return d;
}
function healP(n){
  const before=p.hp;p.hp=Math.min(p.maxHp,p.hp+n);
  const g=p.hp-before;log(`HPが${g}回復した。`);popup('pl','+'+g,'heal');render();
}
async function apply(r,P){
  if(r.gold){p.gold+=r.gold;log(`ゴールドレイン：${fmt(r.gold)}Gを得た！`);popup('pl','+'+fmt(r.gold)+'G','gold');render();}
  if(r.hpCost){p.hp=Math.max(1,p.hp-r.hpCost);log(`HPを${r.hpCost}支払った。`);popup('pl','-'+r.hpCost,'hurt');render();await sleep(250)}
  if(r.dbl){p.dbl=true;log('次のダメージが2倍になる！');render();await sleep(300)}
  if(r.dmg){const res=runPipeline(r.dmg,P,false);await cascade(res,r.note);const d=await hit(res.final);p.dbl=false;p.bank=0;if(equipped().some(it=>it.id==='chainorb'))p.chain=(p.chain||0)+1;if(r.drain&&d>0)healP(d);for(const it of equipped()){if(it.hit){const h=it.hit(d);if(h&&h.heal){p.hot=it.id;healP(h.heal)}}}p.hot=null}
  if(e.hp<=0)return;
  if(r.poison){const pmul=equipped().reduce((m,it)=>m*(it.poisonMul||1),1);e.poison={t:3,d:R(r.poison*pmul)};log(`${e.name}は毒に侵された！`);render()}
  if(r.burn){e.burn={t:3,d:Math.max(1,R(r.burn))};log(`${e.name}は火傷した！`);render()}
  if(r.bleed){e.bleed={t:3,d:Math.max(1,R(r.bleed))};log(`${e.name}は出血した！`);render()}
  if(r.stun){if(e.boss){e.weak=true;log('ボスにはスタンが効かない！次の攻撃を弱体化！')}else{e.stun=1;log(`${e.name}はスタンした！`)}render()}
  if(r.vulnerable){e.vulnerable=true;log(`${e.name}の防御の隙を作った！次の攻撃の被ダメージ1.5倍！`);render()}
  if(r.weaken){e.weak=true;log(`${e.name}の次の攻撃が弱まった！`);render()}
  if(r.freeze){
    if(e.boss){e.weak=true;log(`${e.name}の次の攻撃が弱まった！`)}
    else if(!e.frozenUsed){e.frozen=true;e.frozenUsed=true;log(`${e.name}は凍りついた！`)}
    else log(`${e.name}はもう凍らない！`);
    render();
  }
  if(r.heal){healP(r.heal);await sleep(300)}
  if(r.shield){
    let sh=r.shield;
    if(r.isGuard){const g=guardFinal(r.shield,P);if(g.steps.length)await cascade(g,r.note);sh=g.final}
    p.shield+=sh;log(`シールドを${sh}張った。`);render();await sleep(300);
  }
  if(r.barrier){p.barrier+=r.barrier;log(`バリアを${r.barrier}張った。`);render();await sleep(300)}
}
async function startBattle(){
  const t=tpl(stage),f=stage+1,tier=tierOf(stage);
  e={...t,name:tierPrefix(stage)+t.name,hp:enemyHp(stage,t),atk:enemyAtk(stage,t),idx:0,frozen:false,frozenUsed:false,weak:false,poison:null,burn:null,bleed:null,stun:0,vulnerable:false};

  p.cdFresh={};p.shield=0;p.barrier=0;p.bank=0;p.chain=0;p.revived=false;p.used={};p.dice=[];p.locked=new Set();p.dbl=false;p.actionsLeft=0;
  turnNo=0;rec(`━━ 地下${stage+1}階：${e.name}（HP${fmt(e.hp)} 攻撃力${fmt(e.atk)}）━━`,'battle');

  log(`${t.boss?'ボス ':''}${e.name}が現れた！`);
  if(has('mpstart'))p.mp=Math.min(p.maxMp,p.mp+4);
  p.berserk=0;p.wrath=0;p.starPower=0;p.battleDiceBonus=equipped().reduce((n,it)=>n+(it.battleDice||0),0);p.undyingCharges=equipped().reduce((n,it)=>n+(it.undying===true?1:(Number(it.undying)||0)),0);
  for(const it of equipped()){if(it.battleStart){const z=it.battleStart();if(z.shield)p.shield+=z.shield;if(z.barrier)p.barrier+=z.barrier;}}
  $('#eart').innerHTML=e.art();retrigger($('#eart'),'enter');

function endTurnCd(){
  // そのターンに使ったスキルは数えない。使っていないスキルは、このターンを1ターンぶん進める。
  for(const k of Object.keys(p.cds)){
    if(!p.cdFresh[k]&&p.cds[k]>0)p.cds[k]--;
    if(p.cds[k]<=0)delete p.cds[k];
  }
  p.cdFresh={};
}
async function playerAct(a){
  const P=pool(),r=a.calc(P);
  busy=true;
  p.actionsLeft--;p.used[a.id]=true;if(a.mp)p.mp-=Math.max(0,a.mp-equipped().reduce((n,it)=>n+(it.mpDiscount||0),0));
  if(a.cd){const w=Math.max(0,a.cd-(has('haste')?1:0)-equipped().reduce((n,it)=>n+(it.cooldownReduce||0),0));if(w>0){p.cds[a.id]=w;p.cdFresh[a.id]=true;rec(`　${a.name}は${w}ターン使えなくなる`,'act')}}
  p.currentSkill=a.id;
  rec(`【行動${p.actions-p.actionsLeft}/${p.actions}】${a.name}${a.mp?`（MP${a.mp}消費）`:''}`,'act');
  rec(`　出目の状況：合計${fmt(P.S)}／最多${P.M}個／揃い×${fmtM(P.mult)}／ペア${P.pairs}組`,'act');
  log(`${a.name}！`,true);render();await sleep(220);
  await apply(r,P);
  if(e.hp<=0){endTurnCd();await win();return}
  p.currentSkill=null;
  if(p.actionsLeft<=0){await enemyPhase();return}
  busy=false;render();
}
async function enemyPhase(){
  busy=true;p.actionsLeft=0;render();await sleep(300);
  for(const [key,label] of [['poison','毒'],['burn','火傷'],['bleed','出血']]){
    const st=e[key];if(!st)continue;const d=st.d;e.hp=Math.max(0,e.hp-d);st.t--;if(st.t<=0)e[key]=null;
    rec(`【${label}】${e.name}に${label}ダメージ${d}`,'take');log(`${label}で${e.name}に${d}のダメージ！`,true);popup('scene',d,'dmg');render();await sleep(350);
    if(e.hp<=0){endTurnCd();await win();return}
  }
  await enemyAct();
  if(p.hp<=0){await lose();return}
  if(e.hp<=0){endTurnCd();await win();return}
  if(has('regen')&&p.hp<p.maxHp){const h=Math.max(1,R(p.maxHp*.03));p.hp=Math.min(p.maxHp,p.hp+h);popup('pl','+'+h,'heal')}
  p.shield=0;
  endTurnCd();
  await startTurn();
  busy=false;render();
}
async function enemyAct(){
  if(e.stun>0){e.stun--;log(`${e.name}はスタンして動けない！`);render();await sleep(500);return}
  if(e.frozen){e.frozen=false;log(`${e.name}は凍りついて動けない！`);render();await sleep(500);return}
  const a=e.pat[e.idx%e.pat.length];e.idx++;
  if(a.m===0){log(`${e.name}は${a.n}。`);render();await sleep(500);return}
  log(`${e.name}の${a.n}！`,true);await sleep(320);
  let d=Math.round(e.atk*a.m);
  const dodger=equipped().find(it=>it.dodge&&Math.random()<it.dodge);if(dodger){log(`${dodger.name}で攻撃を回避した！`);render();await sleep(350);return}
  rec(`【${e.name}の攻撃】${a.n}：攻撃力${fmt(e.atk)}×${a.m}＝${fmt(d)}`,'take');
  if(has('armor')){d=Math.max(1,R(d*.85));rec(`　鉄の覚悟 ×0.85 → ${d}`,'take')}
  for(const it of equipped()){if(it.take){const f=it.take();if(f!==1){d=Math.max(1,R(d*f));rec(`　${it.name} ×${f} → ${d}`,'take')}}}
  if(e.weak){d=Math.ceil(d/2);e.weak=false;rec(`　弱体化で半減 → ${d}`,'take')}
  let blocked=0;
  if(p.shield>0){const x=Math.min(p.shield,d);p.shield-=x;d-=x;blocked+=x;rec(`　シールドが${x}防いだ → 残り${d}`,'take');log(`シールドが${x}防いだ！`,true)}
  if(d>0&&p.barrier>0){const x=Math.min(p.barrier,d);p.barrier-=x;d-=x;blocked+=x;rec(`　バリアが${x}防いだ → 残り${d}`,'take');log(`バリアが${x}防いだ！`,true)}
  if(blocked>0&&equipped().some(it=>it.id==='bulwark')){p.bank+=blocked*0.3;log(`要塞の鎧：防いだ分を力に変えた。`)}
  if(d>0){
    p.hp=Math.max(0,p.hp-d);
    if(p.hp<=0&&(p.undyingCharges||0)>0){p.undyingCharges--;p.hp=1;log('不死の加護でHP1で踏みとどまった！');popup('pl','耐えた','heal')}
    for(const it of equipped()){if(it.onTaken){const h=it.onTaken(d);if(h>0&&p.hp>0){p.hp=Math.min(p.maxHp,p.hp+h);log(`${it.name}：HPが${h}回復！`)}}}
    rec(`　▶ 勇者は${fmt(d)}のダメージ（HP ${fmt(p.hp)}/${fmt(p.maxHp)}）`,'take');
    log(`勇者は${fmt(d)}のダメージを受けた！`,true);popup('pl','-'+fmt(d),'hurt');flash();
    if(p.hp<=0&&!p.revived&&equipped().some(it=>it.id==='phoenix')){
      p.revived=true;p.hp=Math.max(1,R(p.maxHp*.6));
      rec(`　不死鳥の羽が輝いた！ HP ${fmt(p.hp)}で復活`,'take');log('不死鳥の羽が輝き、勇者は蘇った！');popup('pl','復活','heal');
    }
    if(p.hp>0){
      for(const it of equipped()){
        if(!it.reflect)continue;
        const rf=R(it.reflect(d)*equipped().reduce((m,x)=>m*(x.refMul||1),1));
        if(rf>0&&e.hp>0){e.hp=Math.max(0,e.hp-rf);p.hot=it.id;log(`${it.name}：${e.name}に${fmt(rf)}の反射ダメージ！`);popup('scene',fmt(rf),'dmg');render();await sleep(300);p.hot=null}
      }
    }
  }else{rec('　▶ ダメージなし','take');popup('pl','0','miss')}
  render();await sleep(450);
}

function makeStock(){
  const items=[];
  const add=o=>items.push({sold:false,...o});
  add({id:'potion',name:'回復薬',price:pr(25),desc:'HPを最大HPの40%回復する。',ok:()=>p.hp<p.maxHp,buy:async()=>{healP(Math.round(p.maxHp*.4))}});
  const extra=[
   {id:'mpot',name:'魔力の薬',price:pr(25),desc:'MPを12回復する。',ok:()=>p.mp<p.maxMp,buy:async()=>{p.mp=Math.min(p.maxMp,p.mp+12)}},
   {id:'hpup',name:'命の実',price:pr(60),desc:'最大HPが20増え、20回復する。',ok:()=>true,buy:async()=>{p.maxHp+=20;p.hp+=20}},
   {id:'mpup',name:'魔力の実',price:pr(55),desc:'最大MPが5増え、5回復する。',ok:()=>true,buy:async()=>{p.maxMp+=5;p.mp+=5}},
  ];
  add(shuffle(extra)[0]);
  add({id:'dice',name:'ダイス追加',price:pr(16+2*p.slots.length),desc:'ふつうのダイスを1個増やす。',ok:()=>true,buy:async()=>{p.slots.push('normal');log('ダイスが1個増えた！')}});
  shuffle(Object.keys(DICE_T).filter(k=>k!=='normal'&&p.slots.length<18)).slice(0,2).forEach(k=>{
    const t=DICE_T[k];
    add({id:'d_'+k,name:t.name,price:pr(t.price),tag:'ダイス',desc:`${t.desc}ダイスが1個増える。`,ok:()=>true,buy:async()=>{p.slots.push(k);log(`${t.name}を手に入れた！`)}});
  });
  const eqs=shuffle(ITEMS.filter(it=>!it.leg&&!ownedItem(it.id)));
  const rare=eqs.find(it=>it.rare),com=eqs.filter(it=>!it.rare);
  [com[0],Math.random()<.5&&rare?rare:com[1]].filter(Boolean).forEach(it=>{
    add({id:'i_'+it.id,name:it.name,price:pr(it.price),tag:`装備・${SLOT_TYPE[it.slot]}${it.rare?'・レア':''}`,desc:it.desc,ok:()=>true,buy:async()=>equipItem(it,true)});
  });
  if(Math.random()<0.06){
    const lg=shuffle(ITEMS.filter(it=>it.leg&&!ownedItem(it.id)))[0];
    if(lg)add({id:'i_'+lg.id,name:lg.name,price:pr(lg.price),leg:true,tag:`装備・${SLOT_TYPE[lg.slot]}・伝説`,desc:lg.desc,ok:()=>true,buy:async()=>equipItem(lg,true)});
  }
  const pool0=SKILLS.filter(s=>!p.skills.includes(s.id));
  if(pool0.length){
    const s=shuffle(pool0)[0];
    add({id:'s_'+s.id,name:s.name,price:pr(70),tag:s.type==='atk'?'スキル':`魔法・MP${s.mp}`,desc:skDesc(s),ok:()=>true,buy:async()=>{p.skills.push(s.id)}});
  }
  return items;
}
function buildHTML(){
  const eq=slotRows().map(r=>`<div class="eqrow"><span class="es">${r.nm}</span>${r.it?`<span><b style="font-weight:normal">${r.it.name}</b><br><span class="sub">${r.it.desc}</span></span>`:'<span class="sub">（空き）</span>'}${mvBtns(r.i,'shop')}</div>`).join('');
  const sp={};p.slots.forEach(t=>{sp[t]=(sp[t]||0)+1});
  const dice=Object.keys(sp).map(t=>`${DICE_T[t].name}×${sp[t]}`).join('、');
  const sk=p.skills.map(id=>SKILL_BY[id].name).join('、')||'なし';
  const ps=p.passives.map(id=>PASSIVE_BY[id].name).join('、')||'なし';
  return `<div class="eqpanel">${eq}<div class="eqrow"><span class="es">ダイス</span><span>${dice}</span></div><div class="eqrow"><span class="es">スキル</span><span>${sk}</span></div><div class="eqrow"><span class="es">パッシブ</span><span>${ps}</span></div></div>`;
}
async function shop(){
  log('旅の商人に出会った。');
  const items=makeStock();curShop=items;
  let showBuild=false;
  while(true){
    const html=`<button class="card go" data-i="eq"><span class="ct" style="justify-content:center"><b>いまの装備・ビルドを見る ${showBuild?'▲':'▼'}</b></span></button>${showBuild?buildHTML():''}`+items.map((it,i)=>{
      const dis=it.sold||p.gold<it.price||!it.ok();
      return `<button class="card ${it.leg?'legend':''}" data-i="${i}" ${dis?'disabled':''}><span class="ct"><b>${it.name}</b><em>${it.sold?'売り切れ':it.price+'G'}</em></span><span class="cd">${it.tag?it.tag+'：':''}${it.desc}</span></button>`;
    }).join('')+`<button class="card go" data-i="leave"><span class="ct" style="justify-content:center"><b>店を出る</b></span></button>`;
    const r=await pickRaw('旅の商人',`所持金 ${fmt(p.gold)}G ／ HP ${fmt(p.hp)}/${fmt(p.maxHp)} ／ MP ${p.mp}/${p.maxMp} ／ ダイス${p.slots.length}個`,html);
    if(r==='leave')break;
    if(r==='eq'){showBuild=!showBuild;continue}
    if(String(r).startsWith('mv:')){moveSlot(String(r).slice(3));continue}
    const it=items[+r];
    if(!it||it.sold||p.gold<it.price||!it.ok())continue;
    p.gold-=it.price;it.sold=true;
    const res=await it.buy();
    if(res===false){p.gold+=it.price;it.sold=false}
    render();
  }
  curShop=null;
}

/* ===== 階クリア報酬（1階ごとに3択で1つ） ===== */
function rewardOptions(boss){
  const cands=[];
  if(boss){
    const rares=shuffle(ITEMS.filter(it=>it.rare&&!ownedItem(it.id))).slice(0,3);
    if(rares.length>=2){
      const out=rares.map(itemOpt);
      if(Math.random()<0.15){const lg=shuffle(ITEMS.filter(it=>it.leg&&!ownedItem(it.id)))[0];if(lg)out[rnd(out.length)]=itemOpt(lg)}
      return out;
    }
  }
  SKILLS.filter(s=>!p.skills.includes(s.id)).forEach(s=>cands.push({w:3,id:'s_'+s.id,name:s.name,tag:s.type==='atk'?'スキル':`魔法・MP${s.mp}`,desc:skDesc(s),apply:()=>{p.skills.push(s.id);log(`${s.name}を覚えた！`)}}));
  ITEMS.filter(it=>!it.leg&&!ownedItem(it.id)).forEach(it=>cands.push({w:it.rare?1:3,...itemOpt(it)}));
  cands.push({w:8,id:'dice1',name:'ダイス+1',tag:'ダイス',desc:'ふつうのダイスが1個増える。',apply:()=>{p.slots.push('normal');log('ダイスが1個増えた！')}});
  cands.push({w:4,id:'dice2',name:'ダイス+2',tag:'ダイス',desc:'ふつうのダイスが2個増える。',apply:()=>{p.slots.push('normal','normal');log('ダイスが2個増えた！')}});
  Object.keys(DICE_T).filter(k=>k!=='normal').forEach(k=>cands.push({w:3,id:'d_'+k,name:DICE_T[k].name,tag:'特殊ダイス',desc:`${DICE_T[k].desc}ダイスが1個増える。`,apply:()=>{p.slots.push(k);log(`${DICE_T[k].name}を手に入れた！`)}}));
  cands.push({w:3,id:'hp',name:'命の実',tag:'強化',desc:'最大HPが20増え、20回復する。',apply:()=>{p.maxHp+=20;p.hp+=20;log('最大HPが20増えた！')}});
  cands.push({w:2,id:'mp',name:'魔力の実',tag:'強化',desc:'最大MPが5増え、5回復する。',apply:()=>{p.maxMp+=5;p.mp+=5;log('最大MPが5増えた！')}});
  const out=[];
  while(out.length<3&&cands.length){
    const tot=cands.reduce((a,c)=>a+c.w,0);let r=Math.random()*tot,i=0;
    for(;i<cands.length;i++){r-=cands[i].w;if(r<=0)break}
    out.push(cands.splice(Math.min(i,cands.length-1),1)[0]);
  }
  if(Math.random()<0.06){const lg=shuffle(ITEMS.filter(it=>it.leg&&!ownedItem(it.id)))[0];if(lg&&out.length)out[rnd(out.length)]=itemOpt(lg)}
  return out;
}

async function passivePick(){
  const pl=PASSIVES.filter(s=>!p.passives.includes(s.id));
  if(!pl.length)return;
  const opts=shuffle(pl).slice(0,3).map(s=>({id:s.id,name:s.name,desc:s.desc,tag:'パッシブ'}));
  const o=await pick('ボスを倒した！','特別な力を1つ選ぼう。ずっと効果が続く。',opts);
  p.passives.push(o.id);
  if(o.id==='dice'){p.slots.push('normal','normal')}
  log(`${o.name}を身につけた！`);render();
}

/* ===== 勝利・次の階へ ===== */
async function win(){
  log(`${e.name}を倒した！`);render();await sleep(500);
  const goldMul=equipped().reduce((m,it)=>m*(it.goldMul||1),1);
  const earned=R(e.gold*goldMul);log(`${fmt(earned)}Gを獲得。`);popup('scene','+'+fmt(earned)+'G','gold');p.gold+=earned;
  for(const it of equipped()){if(it.onWin){const g=it.onWin();if(g>0){p.gold+=g;log(`${it.name}：${fmt(g)}G増えた！`)}}if(it.onWinHeal){const h=it.onWinHeal();if(h>0){p.hp=Math.min(p.maxHp,p.hp+h);log(`${it.name}：HPが${fmt(h)}回復！`)}}if(it.onWinMp){p.mp=Math.min(p.maxMp,p.mp+it.onWinMp);log(`${it.name}：MPが${it.onWinMp}回復！`)}}
  p.maxHp+=CFG.floorHp;p.maxMp+=CFG.floorMp;
  const h=Math.round(p.maxHp*CFG.winHeal)+CFG.floorHp;
  p.hp=Math.min(p.maxHp,p.hp+h);p.mp=Math.min(p.maxMp,p.mp+CFG.winMp);
  render();saveBest();
  const finalBoss=stage===FLOORS-1&&!p.endless;
  if(!finalBoss)await rewardPick();
  if(e.boss&&!finalBoss)await passivePick();
  const due=!finalBoss&&shopAfter(stage+1);
  if(!finalBoss)persist(stage+1,due,due);
  if(due){await shop();persist(stage+1,false,false)}
  // ショップだけでなく、階層の合間にランダムイベントも発生する。
  const eventChance=due ? .18 : (e.boss ? .22 : .42);
  if(!finalBoss&&Math.random()<eventChance){await randomEvent();persist(stage+1,false,true)}
  await nextFloor();
}
async function nextFloor(){
  stage++;
  if(stage>=FLOORS&&!p.endless){stage=FLOORS-1;clearSave();showEnd(true);return}
  if(p.endless&&stage%FLOORS===0)await inflate();
  await startBattle();busy=false;render();
}
async function inflate(){
  const tier=tierOf(stage);
  growSlots();
  log(`インフレ突入！（段階${tier}）全ての装備枠が1つ増えた。`);render();
  const pl=ITEMS.filter(it=>(it.rare||it.leg)&&!ownedItem(it.id));
  const out=[];
  while(out.length<3&&pl.length){
    const tot=pl.reduce((a,it)=>a+(it.leg?1:2),0);let r=Math.random()*tot,i=0;
    for(;i<pl.length;i++){r-=(pl[i].leg?1:2);if(r<=0)break}
    out.push(pl.splice(Math.min(i,pl.length-1),1)[0]);
  }
  if(out.length){
    const o=await pick(`インフレ突入！ 地下${stage+1}階へ`,'全ての装備枠が1つ増えた！ 強力な装備を1つ選ぼう。',out.map(itemOpt));
    await o.apply();render();
  }
}
async function enterEndless(){
  p.endless=true;busy=true;
  persist(stage+1,false,true);
  await nextFloor();
}
async function resume(sv0){
  p=restoreP(sv0.p);logLines=[];fullLog=[];turnNo=0;busy=true;
  const next=Math.max(1,Math.floor(sv0.next));
  stage=next-1;
  const t=tpl(stage);
  e={...t,name:tierPrefix(stage)+t.name,hp:0,maxHp:enemyHp(stage,t),atk:enemyAtk(stage,t),idx:0,frozen:false,frozenUsed:false,weak:false,poison:null,burn:null,bleed:null,stun:0,vulnerable:false,gold:0};
  $('#eart').innerHTML=e.art();
  log('セーブデータを読み込んだ。');render();
  if(sv0.shopPending&&shopAfter(next)){await shop();persist(next,false,false)}
  await nextFloor();
}
async function lose(){
  clearSave();
  log('勇者はたおれた…');render();await sleep(800);showEnd(false);
}
function showEnd(clear){
  const b=saveBest();
  const learned=p.skills.map(id=>SKILL_BY[id].name).join('、');
  const recTxt=`最大ダメージ ${fmt(p.maxHit||0)}／自己ベスト：地下${b.floor}階・最大ダメージ${fmt(b.maxHit)}`;
  if(clear){
    showOv('迷宮を制覇した！',`${e.name}を倒した。ダイス${p.slots.length}個、所持金は${fmt(p.gold)}G。`,
      `<p>覚えた技と魔法：${learned}<br>${recTxt}</p><button class="card go legend" id="endless"><span class="ct" style="justify-content:center"><b>エンドレスに挑む（インフレ突入）</b></span><span class="cd" style="text-align:center;width:100%">全ての装備枠が+1。敵は加速度的に強くなる。</span></button><button class="card go" id="go"><span class="ct" style="justify-content:center"><b>もう一度あそぶ</b></span></button>`);
    $('#endless').onclick=()=>{hideOv();enterEndless()};
    $('#go').onclick=()=>{hideOv();newGame()};
  }else screen('やられてしまった…',`地下${stage+1}階（${layerOf(stage).name}）、${e.name}との戦いで力尽きた。（ダイス${p.slots.length}個）`,`<p>覚えた技と魔法：${learned}<br>${recTxt}<br>所持金${fmt(p.gold)}Gは迷宮に消えた。</p>`,'はじめからやり直す',newGame);
}

/* ===== ログ画面 ===== */
function logRows(mode){
  let from=0;
  if(mode==='turn'){for(let i=fullLog.length-1;i>=0;i--){if(fullLog[i].k==='turn'){from=i;break}}}
  else if(mode==='battle'){for(let i=fullLog.length-1;i>=0;i--){if(fullLog[i].k==='battle'){from=i;break}}}
  return fullLog.slice(from).map(x=>`<div class="lg ${x.k}">${x.t}</div>`).join('')||'<div class="lg">まだログがありません。</div>';
}
function openLog(mode){
  const m=mode||'turn';
  const label={turn:'このターン',battle:'この戦闘',all:'すべて'};
  showOv('ログ','ダイスを振ってから攻撃・被ダメージまでの流れを確認できます。',
    `<div class="lgbtns">${['turn','battle','all'].map(k=>`<button class="sbtn" data-i="${k}" ${k===m?'disabled':''}>${label[k]}</button>`).join('')}<button class="sbtn" data-i="close">閉じる</button></div><div class="lgbox" id="lgbox">${logRows(m)}</div>`);
  const box=$('#lgbox');if(box)box.scrollTop=box.scrollHeight;
  $('#ovB').onclick=ev=>{
    const b=ev.target.closest('button[data-i]');if(!b||b.disabled)return;
    $('#ovB').onclick=null;
    if(b.dataset.i==='close'){hideOv();return}
    openLog(b.dataset.i);
  };
}

/* ===== 入力 ===== */
$('#dice').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.x==='log'){openLog('turn');return}
  if(busy)return;
  if(b.dataset.f!==undefined){
    const f=+b.dataset.f;
    if(p.locked.has(f))p.locked=new Set();else if(p.dice.some(d=>d.v===f))p.locked=new Set([f]);
    render();return;
  }
  if(b.dataset.x==='reroll')return reroll();
  if(b.dataset.x==='end')return enemyPhase();
});
$('#equip').addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-mv]');if(!b||busy)return;
  if(moveSlot(b.dataset.mv))render();
});
$('#cmd').addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-a]');if(!b||busy)return;
  const a=ALL[b.dataset.a];
  if(!a||p.actionsLeft<=0||p.used[a.id]||(p.cds[a.id]||0)>0)return;
  if(!a.calc(pool()).ok)return;
  if(a.mp&&p.mp<a.mp)return;
  playerAct(a);
});

/* ===== 開始 ===== */
function newGame(){
  p={hp:CFG.hp,maxHp:CFG.hp,mp:CFG.mp,maxMp:CFG.mp,gold:0,
     skills:['smash','fire'],passives:[],slots:Array(CFG.dice).fill('normal'),
     equip:baseSlots(),endless:false,maxHit:0,cds:{},cdFresh:{},chain:0,revived:false,hot:null,rerollsUsed:0,bank:0,
     shield:0,barrier:0,used:{},dice:[],locked:new Set(),rerolls:0,actions:CFG.actions,actionsLeft:0,dbl:false};
  stage=0;logLines=[];fullLog=[];turnNo=0;busy=true;bestCache=loadBest();
  startBattle().then(()=>{busy=false;render()});
}
function titleScreen(){
  const sd=loadSave();
  let armed=false;
  const intro=`<ul><li>ダイスは何個でも増える。毎ターン全部振って、出目の集計を見る</li><li>ダメージの土台は出目の合計。同じ目が揃うとボーナス</li><li>キープできる目は1種類だけ。振り直しは1ターン3回</li><li>装備（武器・防具・アクセ2つ）は出目に反応して、上から順に発動する。▲▼で順番を入れ替えられる（＋と×で結果が変わる）</li><li>1ターンに動ける回数は3回。各行動は1回まで</li><li>スキルと魔法は、使うと数ターン使えなくなる。次の階にも持ち越しで、戦闘が終わったターンも1ターンに数える</li><li>1階クリアごとに報酬を1つ選ぶ。お店で装備やダイスを買える</li><li>20階をクリアすると、エンドレス（インフレ）に挑める。20階ごとに全ての装備枠が+1</li><li>階をクリアするたびに自動セーブ。やられたらセーブもお金も消える</li></ul>`;
  const cont=sd?`<button class="card go" id="cont"><span class="ct" style="justify-content:center"><b>つづきから</b></span><span class="cd" style="text-align:center;width:100%">地下${Math.max(1,Math.floor(sd.next))+1}階${sd.p.endless?'（エンドレス）':''} ／ ダイス${(sd.p.slots||[]).length}個 ／ ${fmt(Number(sd.p.gold)||0)}G${sd.shopPending?' ／ お店の前':''}</span></button>`:'';
  const start=`<button class="card go" id="go"><span class="ct" style="justify-content:center"><b id="goT">${sd?'はじめから':'冒険をはじめる'}</b></span></button>`;
  const bst=loadBest();
  const note=(canSave?'':'<p class="sub" style="margin:10px 0 0">この環境ではセーブできません。</p>')+(bst.floor?`<p class="sub" style="margin:10px 0 0">自己ベスト：地下${bst.floor}階／最大ダメージ ${fmt(bst.maxHit)}</p>`:'');
  showOv('ちいさな迷宮 ダイス版','全20階。スライムの洞窟、ゴブリンの砦、亡者の墓所、雷鳴の遺跡を抜けて、最深部を目指そう。',intro+cont+start+note);
  if(sd)$('#cont').onclick=()=>{hideOv();resume(sd)};
  $('#go').onclick=()=>{
    if(sd&&!armed){armed=true;$('#goT').textContent='本当にはじめから？（セーブは消えます）';return}
    hideOv();if(sd)clearSave();newGame();
  };
}
titleScreen();
})();
</script>
